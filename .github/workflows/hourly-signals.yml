name: Hourly TW Alerts (上市 + 上櫃)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hourly-signals.yml"
      - "scan_signals.py"
      - "universe.py"
      - "watchlist.py"
      - "tw_stocks_constituents.py"
      - "static/**"
      - "ardr.py"
      - "trendlines.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hourly-tw-alerts
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scan TWSE + TPEx universe
        if: github.event_name != 'push'
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python -u scan_signals.py

      - name: Commit signal report
        if: github.event_name != 'push'
        run: |
          git add signals/latest.json signals/latest.html signals/index.html signals/watchlist.html
          if git diff --staged --quiet; then
            echo "No signal file changes"
            exit 0
          fi
          git commit -m "chore: update TW hourly touch alerts (上市 + 上櫃)"
          git pull --rebase origin main || true
          for i in 1 2 3; do
            git push origin main && break
            echo "Push failed, retry $i/3..."
            git pull --rebase origin main || true
            sleep 5
          done
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Prepare Pages site
        if: github.event_name != 'push'
        run: |
          mkdir -p _site
          cp signals/latest.html _site/index.html
          cp signals/watchlist.html _site/watchlist.html
          cp signals/latest.json _site/latest.json
          cp signals/chart-packs.json _site/chart-packs.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'push'
        with:
          path: _site

  deploy:
    needs: scan
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
