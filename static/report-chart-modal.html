<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(function () {
  const PACKS = window.CHART_PACKS || {};

  const modal = document.getElementById("chart-modal");
  const titleEl = document.getElementById("chart-title");
  const subEl = document.getElementById("chart-sub");
  const statusEl = document.getElementById("chart-status");
  const lwcEl = document.getElementById("lwc");
  const frameEl = document.getElementById("tv-frame");
  const closeBtn = document.getElementById("chart-close");
  let liveModal = null;
  let openToken = 0;
  let remoteCharts = null;
  let remoteChartsPromise = null;

  function chartPackUrls() {
    const path = location.pathname || "/";
    const base = path.endsWith("/") ? path : path.slice(0, path.lastIndexOf("/") + 1) || "/";
    return [base + "chart-packs.json"];
  }

  async function loadRemoteCharts() {
    if (remoteCharts) return remoteCharts;
    if (!remoteChartsPromise) {
      remoteChartsPromise = (async () => {
        const merged = {};
        for (const url of chartPackUrls()) {
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (!res.ok) continue;
            const data = await res.json();
            Object.assign(merged, data.charts || {});
          } catch (_) {}
        }
        if (!Object.keys(merged).length) {
          try {
            const res = await fetch(
              (location.pathname || "/").replace(/[^/]*$/, "") + "chart-packs.json",
              { cache: "no-store" }
            );
            if (res.ok) {
              const data = await res.json();
              Object.assign(merged, data.charts || {});
            }
          } catch (_) {}
        }
        return merged;
      })();
    }
    remoteCharts = await remoteChartsPromise;
    return remoteCharts;
  }

  async function resolvePack(group, symbol, tf) {
    const key = packKey(group, symbol, tf);
    const local = PACKS[key];
    if (local && local.candles && local.candles.length) return local;
    const remote = await loadRemoteCharts();
    const pack = remote[key];
    if (pack && pack.candles && pack.candles.length) return pack;
    return null;
  }

  function packKey(group, symbol, tf) {
    return group + "|" + symbol + "|" + tf;
  }

  function tvSymbol(group, symbol, tvOverride) {
    if (tvOverride) return tvOverride;
    if (group === "twse") return "TWSE:" + symbol;
    if (group === "tpex") return "TPEX:" + symbol;
    if (group === "index" && symbol === "TWII") return "TWSE:TWII";
    if (group === "dji") return "NYSE:" + symbol;
    if (group === "ndx") return "NASDAQ:" + symbol;
    if (group === "index" && symbol === "DJI30") return "DJI";
    if (group === "index" && symbol === "NDX100") return "NASDAQ:NDX";
    if (group === "tpex") return "TPEX:" + symbol.replace(".TWO", "");
    if (symbol === "TXF1!" || symbol.endsWith("TXF1!")) return "TAIFEX:TXF1!";
    return symbol;
  }

  function buildTvEmbedUrl(group, symbol, tf, opts) {
    const tv = tvSymbol(group, symbol, opts && opts.tvSymbol);
    const params = new URLSearchParams({
      symbol: tv,
      interval: tvInterval(tf),
      theme: "dark",
      style: "1",
      locale: "zh_TW",
      timezone: "Asia/Taipei",
      toolbarbg: "0c121c",
      hideideas: "1",
      hidesidetoolbar: "0",
      symboledit: "1",
      saveimage: "0",
      withdateranges: "1",
    });
    if (opts && opts.logScale) {
      params.set("overrides", JSON.stringify({
        "mainSeriesProperties.priceAxisProperties.log": true,
      }));
    }
    return "https://s.tradingview.com/widgetembed/?" + params.toString();
  }

  function tvInterval(tf) {
    if (tf === "1d") return "D";
    if (tf === "4h") return "240";
    return "60";
  }

  function fmtLevel(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return String(v || "");
    return n.toLocaleString(undefined, { maximumFractionDigits: 8 });
  }

  function typeLabel(type, kind) {
    if (kind === "ar_dr_touch") return type || "AR/AD";
    if (kind === "ar_dr_late_touch") return (type || "AR/AD") + " 晚觸碰";
    if (kind === "ar_dr_near") return (type || "AR/AD") + " 接近未觸";
    if (kind === "trend_exceed") {
      if (type === "resistance") return "阻力超出";
      if (type === "support") return "支撐超出";
    }
    if (kind === "trend_reclaim") {
      if (type === "resistance") return "阻力超出後站回";
      if (type === "support") return "支撐超出後站回";
    }
    if (type === "resistance") return "阻力線";
    if (type === "support") return "支撐線";
    return type || "觸碰";
  }

  function destroyChart() {
    if (liveModal) {
      liveModal.destroy();
      liveModal = null;
    }
    lwcEl.innerHTML = "";
    frameEl.removeAttribute("src");
    frameEl.hidden = true;
    lwcEl.hidden = true;
  }

  function closeModal() {
    openToken += 1;
    destroyChart();
    modal.classList.remove("open");
    modal.hidden = true;
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
  }

  function showStatus(msg) {
    statusEl.hidden = false;
    statusEl.textContent = msg;
  }

  function hideStatus() {
    statusEl.hidden = true;
  }

  const LINE_W = 1;
  const SUPPORT_COLOR = "34,197,94";      // 上升支撐 · 綠
  const RESISTANCE_COLOR = "239,68,68";   // 下降阻力 · 紅

  function candleTimes(candles) {
    const set = new Set();
    for (const c of candles) set.add(c.time);
    return set;
  }

  function visiblePoints(points, times) {
    const pts = [];
    const seen = new Set();
    for (const a of points || []) {
      const t = a && a.time;
      const px = a && a.price;
      if (t == null || px == null || seen.has(t)) continue;
      if (times && times.size && !times.has(t) && !times.has(Number(t))) continue;
      seen.add(t);
      pts.push({ time: t, value: Number(px) });
    }
    pts.sort((x, y) => x.time - y.time);
    return pts;
  }

  const TOUCH_TOL_PCT = 0.0045;
  const MERGE_TOUCH_BARS = 5;

  function inferTouches(line, candles) {
    const stored = visiblePoints(line.touches, candleTimes(candles));
    if (stored.length) return stored;
    if (!line || !line.p1 || !candles.length) return [];
    const tStart = Number(line.p1.time);
    const tEnd = Number(line.endTime != null ? line.endTime : (candles[candles.length - 1] || {}).time);
    if (!Number.isFinite(tStart) || !Number.isFinite(tEnd)) return [];
    let i1 = candles.findIndex((c) => c.time === tStart || c.time === Number(line.p1.time));
    if (i1 < 0) i1 = candles.findIndex((c) => c.time >= tStart);
    if (i1 < 0) return [];
    let i2 = -1;
    if (line.p2 && line.p2.time != null) {
      i2 = candles.findIndex((c) => c.time === Number(line.p2.time));
    }
    if (i2 < 0) i2 = candles.findIndex((c) => c.time === tEnd);
    if (i2 < 0) i2 = candles.length - 1;
    const p1 = Number(line.p1.price);
    const pRef = i2 !== i1 && line.p2 && line.p2.price != null
      ? Number(line.p2.price)
      : Number(line.endPrice != null ? line.endPrice : p1);
    const slope = i2 !== i1 ? (pRef - p1) / (i2 - i1) : 0;
    const isRes = line.type === "resistance";
    const hits = [];
    for (let i = i1; i < candles.length; i++) {
      const c = candles[i];
      if (c.time > tEnd) break;
      const lp = p1 + slope * (i - i1);
      const wick = isRes ? c.high : c.low;
      const tol = Math.max(Math.abs(lp) * TOUCH_TOL_PCT, 1e-9);
      if (Math.abs(wick - lp) <= tol) hits.push(i);
    }
    const merged = [];
    for (const i of hits) {
      if (!merged.length || i - merged[merged.length - 1] > MERGE_TOUCH_BARS) merged.push(i);
    }
    return merged.map((i) => ({
      time: candles[i].time,
      value: p1 + slope * (i - i1),
    }));
  }

  function rayColor(type, active) {
    const rgb = type === "AR" ? "0,232,150" : "255,77,109";
    return active ? `rgba(${rgb},1)` : `rgba(${rgb},0.35)`;
  }

  function takeLastBars(candles, maxBars) {
    const n = Number(maxBars);
    if (!n || n <= 0 || candles.length <= n) return candles;
    return candles.slice(-n);
  }

  function normalizeCandles(candles) {
    const out = [];
    let prev = null;
    for (const c of candles) {
      let t, o, h, l, cl;
      if (Array.isArray(c)) {
        t = c[0]; o = c[1]; h = c[2]; l = c[3]; cl = c[4];
      } else {
        t = c.time; o = c.open; h = c.high; l = c.low; cl = c.close;
      }
      if (t == null || prev != null && t <= prev) continue;
      out.push({ time: t, open: o, high: h, low: l, close: cl });
      prev = t;
    }
    return out;
  }

  function createPackChart(hostEl, pack, options) {
    const interactive = !options || options.interactive !== false;
    const candles = takeLastBars(normalizeCandles(pack.candles || []), options && options.maxBars);
    if (!candles.length) throw new Error("no candles");

    const chart = LightweightCharts.createChart(hostEl, {
      layout: { background: { color: "#000000" }, textColor: "#7a93a8" },
      grid: {
        vertLines: { color: "rgba(0,240,200,0.05)" },
        horzLines: { color: "rgba(0,240,200,0.05)" },
      },
      rightPriceScale: { borderColor: "#2a364d", scaleMargins: { top: 0.08, bottom: 0.08 } },
      timeScale: {
        borderColor: "#2a364d",
        timeVisible: interactive,
        secondsVisible: false,
      },
      crosshair: {
        mode: interactive
          ? LightweightCharts.CrosshairMode.Normal
          : LightweightCharts.CrosshairMode.Hidden,
      },
      handleScroll: interactive,
      handleScale: interactive,
    });
    const series = chart.addCandlestickSeries({
      upColor: "#00e896",
      downColor: "#ff4d6d",
      borderUpColor: "#00e896",
      borderDownColor: "#ff4d6d",
      wickUpColor: "#5dffb1",
      wickDownColor: "#ff7a90",
      lastValueVisible: interactive,
      priceLineVisible: interactive,
    });
    series.setData(candles);

    function drawSegment(t0, p0, t1, p1, color, width, style) {
      if (t0 == null || t1 == null || t0 === t1) return;
      const s = chart.addLineSeries({
        color,
        lineWidth: width,
        lineStyle: style ?? LightweightCharts.LineStyle.Solid,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false,
      });
      s.setData([
        { time: t0, value: p0 },
        { time: t1, value: p1 },
      ]);
    }

    function drawTouchPoints(pts, color) {
      if (!pts.length) return;
      let data = pts;
      if (pts.length === 1) {
        const t = pts[0].time;
        const i = candles.findIndex((c) => c.time === t);
        const other =
          i >= 0 && i + 1 < candles.length
            ? candles[i + 1].time
            : i > 0
              ? candles[i - 1].time
              : null;
        if (other == null) return;
        const stub = { time: other, value: pts[0].value };
        data = t < other ? [pts[0], stub] : [stub, pts[0]];
      }
      const s = chart.addLineSeries({
        color,
        lineWidth: 0,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: false,
        pointMarkersVisible: true,
        pointMarkersRadius: 2,
      });
      s.setData(data);
    }

    const useExpand = window.TREND_LINE_SOURCE === "expand";
    const trendLines = useExpand
      ? (pack.trend_lines_expand || pack.trend_lines || [])
      : (pack.trend_lines || []);
    const maxTouchByType = {};
    trendLines.forEach((line) => {
      const t = line.type || "";
      const n = Number(line.pivot_count) || 0;
      maxTouchByType[t] = Math.max(maxTouchByType[t] || 0, n);
    });
    trendLines.forEach((line) => {
      const maxTouch = maxTouchByType[line.type] || 0;
      const touchN = Number(line.pivot_count) || 0;
      const weaker = !line.invalidated && maxTouch > 0 && touchN < maxTouch;
      const alpha = line.invalidated ? 0.3 : weaker ? 0.5 : 0.95;
      const isIce = line.label === "ice";
      const isCreek = line.label === "creek";
      let rgb = line.type === "resistance" ? RESISTANCE_COLOR : SUPPORT_COLOR;
      if (isCreek) rgb = "34,211,238";
      if (isIce) rgb = "125,211,252";
      const color = `rgba(${rgb},${alpha})`;
      const style = (line.is_channel || line.horizontal || isCreek || isIce)
        ? LightweightCharts.LineStyle.Dashed
        : LightweightCharts.LineStyle.Solid;
      drawSegment(line.p1.time, line.p1.price, line.endTime, line.endPrice, color, LINE_W, style);
      drawTouchPoints(inferTouches(line, candles), `rgba(${rgb},1)`);
    });

    (pack.rays || []).forEach((ray) => {
      const segs = ray.segments || [];
      for (const seg of segs) {
        if (seg.t0 == null || seg.t1 == null || seg.t0 >= seg.t1) continue;
        drawSegment(
          seg.t0,
          seg.price,
          seg.t1,
          seg.price,
          rayColor(ray.type, seg.active),
          LINE_W,
          LightweightCharts.LineStyle.Dashed
        );
      }
    });

    chart.timeScale().fitContent();
    const resizeObs = new ResizeObserver(() => {
      if (!hostEl.clientWidth || !hostEl.clientHeight) return;
      chart.applyOptions({ width: hostEl.clientWidth, height: hostEl.clientHeight });
    });
    resizeObs.observe(hostEl);
    chart.applyOptions({ width: hostEl.clientWidth, height: hostEl.clientHeight });

    return {
      destroy() {
        resizeObs.disconnect();
        chart.remove();
        hostEl.innerHTML = "";
      },
    };
  }

  function renderPack(pack) {
    destroyChart();
    lwcEl.hidden = false;
    frameEl.hidden = true;
    liveModal = createPackChart(lwcEl, pack, { interactive: true, maxBars: 600 });
  }

  function renderTradingView(group, symbol, tf, opts) {
    destroyChart();
    lwcEl.hidden = true;
    frameEl.hidden = false;
    frameEl.src = buildTvEmbedUrl(group, symbol, tf, opts);
  }

  function ardrSummary(pack) {
    if (!pack) return "無圖表資料";
    const rays = pack.rays || [];
    const useExpand = window.TREND_LINE_SOURCE === "expand";
    const lines = useExpand
      ? (pack.trend_lines_expand || pack.trend_lines || [])
      : (pack.trend_lines || []);
    const ar = rays.filter((r) => r.type === "AR");
    const ad = rays.filter((r) => r.type === "AD" || r.type === "DR");
    const arOn = ar.filter((r) => r.active).length;
    const adOn = ad.filter((r) => r.active).length;
    const tlValid = lines.filter((l) => !l.invalidated).length;
    const bits = [];
    if (ar.length) bits.push(`AR ${arOn}/${ar.length} 有效`);
    else bits.push("AR 無");
    if (ad.length) bits.push(`AD ${adOn}/${ad.length} 有效`);
    else bits.push("AD 無");
    bits.push((useExpand ? "趨勢線擴展 " : "趨勢線 ") + tlValid + "/" + lines.length);
    if (useExpand && lines.length) {
      const lbs = lines
        .map((l) => Number(l.search_lookback) || 0)
        .filter((n) => n > 0);
      if (lbs.length) bits.push("搜尋 " + Math.max.apply(null, lbs) + "K");
    }
    return bits.join(" · ");
  }

  async function openChart(btn) {
    const symbol = btn.dataset.symbol || "";
    const group = btn.dataset.group || "";
    const name = btn.dataset.name || symbol;
    const tf = btn.dataset.tf || "1d";
    const level = btn.dataset.level || "";
    const type = btn.dataset.type || "";
    const kind = btn.dataset.kind || "";
    const source = btn.dataset.source || "";
    const tvOverride = btn.dataset.tvSymbol || "";
    const logScale = btn.dataset.logScale === "1";
    const useTradingView = source === "tradingview" || symbol === "TXF1!";
    const token = ++openToken;
    const tvOpts = { tvSymbol: tvOverride, logScale };

    titleEl.textContent = `${symbol} · ${tf === "1d" ? "1D" : tf === "4h" ? "4H" : tf === "1h" ? "1H" : tf.toUpperCase()}`;
    const fromWatchlist = kind === "watchlist" || kind === "chartpack";

    modal.hidden = false;
    modal.setAttribute("aria-hidden", "false");
    requestAnimationFrame(() => modal.classList.add("open"));
    document.body.style.overflow = "hidden";
    destroyChart();
    showStatus(useTradingView ? "載入 TradingView…" : "載入蠟燭圖…");

    try {
      if (useTradingView) {
        if (fromWatchlist) {
          subEl.innerHTML =
            `${escapeHtml(name)} · TradingView` +
            (logScale ? " · <strong>對數座標</strong>" : "") +
            " · 趨勢線 / AR/AD 請在圖表工具列查看";
        }
        if (token !== openToken) return;
        hideStatus();
        renderTradingView(group, symbol, tf, tvOpts);
        return;
      }

      const pack = await resolvePack(group, symbol, tf);
      if (fromWatchlist) {
        subEl.innerHTML =
          `${escapeHtml(name)} · ${escapeHtml(group)} · ${escapeHtml(ardrSummary(pack))}`;
      } else {
        const rayN = pack && pack.rays ? pack.rays.length : 0;
        const tlN = pack && pack.trend_lines ? pack.trend_lines.length : 0;
        subEl.innerHTML =
          `${escapeHtml(name)} · ${escapeHtml(group)} · ${escapeHtml(typeLabel(type, kind))}` +
          (level ? ` · Level <strong>${escapeHtml(fmtLevel(level))}</strong>` : "") +
          (pack ? ` · AR/AD ${rayN} · 趨勢線 ${tlN}` : "");
      }

      if (pack && pack.candles && pack.candles.length) {
        if (token !== openToken) return;
        hideStatus();
        renderPack(pack);
        return;
      }

      if (token !== openToken) return;
      lwcEl.hidden = true;
      frameEl.hidden = true;
      showStatus("無法載入此商品圖表，請稍後再試");
    } catch (err) {
      if (token !== openToken) return;
      lwcEl.hidden = true;
      frameEl.hidden = true;
      showStatus("圖表載入失敗，請稍後再試");
    }
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  document.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".sym-btn");
    if (btn) {
      ev.preventDefault();
      openChart(btn);
      return;
    }
    if (ev.target === modal) closeModal();
  });
  closeBtn.addEventListener("click", closeModal);

  const CATALOG = window.SYMBOL_CATALOG || [];
  const GROUP_LABEL = { index: "指數", dji: "DJI30", ndx: "NDX100", sp500: "SP500", twse: "上市", tpex: "上櫃" };
  const fab = document.getElementById("symbolFab");
  const searchOverlay = document.getElementById("symbolOverlay");
  const searchInput = document.getElementById("symbolSearch");
  const searchList = document.getElementById("symbolList");
  const searchClose = document.getElementById("symbolSearchClose");
  let searchHi = -1;
  let searchTimer = null;

  function tfLabel(tf) {
    if (tf === "1d") return "1D";
    if (tf === "4h") return "4H";
    if (tf === "1h") return "1H";
    return (tf || "?").toUpperCase();
  }

  function openSymbolSearch() {
    if (!searchOverlay) return;
    searchOverlay.hidden = false;
    searchInput.value = "";
    searchHi = -1;
    renderSearchList(CATALOG.slice(0, 80), CATALOG.length ? "輸入代碼或名稱篩選…" : "無掃描商品");
    requestAnimationFrame(() => searchInput.focus());
  }

  function closeSymbolSearch() {
    if (!searchOverlay) return;
    searchOverlay.hidden = true;
    searchHi = -1;
    clearTimeout(searchTimer);
  }

  function filterCatalog(q) {
    const s = q.trim().toLowerCase();
    if (!s) return CATALOG.slice(0, 80);
    return CATALOG.filter((item) => {
      const hay = [
        item.symbol,
        item.name,
        item.group,
        GROUP_LABEL[item.group] || item.group,
        tfLabel(item.timeframe),
      ].join(" ").toLowerCase();
      return hay.includes(s);
    }).slice(0, 80);
  }

  function renderSearchList(items, emptyMsg) {
    if (!searchList) return;
    searchList.innerHTML = "";
    if (!items.length) {
      searchList.innerHTML = `<li class="empty">${escapeHtml(emptyMsg)}</li>`;
      searchHi = -1;
      return;
    }
    searchHi = 0;
    items.forEach((item, i) => {
      const li = document.createElement("li");
      li.dataset.index = String(i);
      li.className = i === 0 ? "active" : "";
      const hit = item.hasHit ? '<span class="hit-badge">Hit</span>' : "";
      li.innerHTML =
        `<span class="sym">${escapeHtml(item.symbol)}</span>` +
        `<span class="ex">${escapeHtml(GROUP_LABEL[item.group] || item.group)} · ${escapeHtml(tfLabel(item.timeframe))}</span>` +
        hit +
        `<span class="desc">${escapeHtml(item.name || "")}</span>`;
      li.addEventListener("mousedown", (ev) => {
        ev.preventDefault();
        pickCatalogItem(item);
      });
      searchList.appendChild(li);
    });
  }

  function pickCatalogItem(item) {
    closeSymbolSearch();
    const sel = `.sym-btn[data-symbol="${CSS.escape(item.symbol)}"][data-group="${CSS.escape(item.group)}"][data-tf="${CSS.escape(item.timeframe)}"]`;
    const hitBtn = document.querySelector(sel);
    if (hitBtn) {
      hitBtn.scrollIntoView({ behavior: "smooth", block: "center" });
      hitBtn.classList.add("flash");
      setTimeout(() => hitBtn.classList.remove("flash"), 1600);
    }
    const btn = document.createElement("button");
    btn.dataset.symbol = item.symbol;
    btn.dataset.group = item.group;
    btn.dataset.name = item.name || item.symbol;
    btn.dataset.tf = item.timeframe;
    openChart(btn);
  }

  function scheduleSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      const items = filterCatalog(searchInput.value);
      renderSearchList(items, "無符合商品");
    }, 180);
  }

  if (fab) fab.addEventListener("click", openSymbolSearch);
  if (searchClose) searchClose.addEventListener("click", closeSymbolSearch);
  if (searchOverlay) {
    searchOverlay.addEventListener("mousedown", (ev) => {
      if (ev.target === searchOverlay) closeSymbolSearch();
    });
  }
  if (searchInput) {
    searchInput.addEventListener("input", scheduleSearch);
    searchInput.addEventListener("keydown", (ev) => {
      const opts = [...(searchList?.querySelectorAll("li[data-index]") || [])];
      if (ev.key === "ArrowDown" && opts.length) {
        ev.preventDefault();
        searchHi = Math.min(searchHi + 1, opts.length - 1);
        opts.forEach((li, i) => li.classList.toggle("active", i === searchHi));
        opts[searchHi].scrollIntoView({ block: "nearest" });
      } else if (ev.key === "ArrowUp" && opts.length) {
        ev.preventDefault();
        searchHi = Math.max(searchHi - 1, 0);
        opts.forEach((li, i) => li.classList.toggle("active", i === searchHi));
        opts[searchHi].scrollIntoView({ block: "nearest" });
      } else if (ev.key === "Enter") {
        const li = opts[searchHi] || opts[0];
        if (li) li.dispatchEvent(new MouseEvent("mousedown", { bubbles: true }));
      }
    });
  }

  document.addEventListener("open-symbol-chart", (ev) => {
    const d = ev.detail || {};
    const fake = document.createElement("button");
    fake.className = "sym-btn";
    fake.dataset.symbol = d.symbol || "";
    fake.dataset.group = d.group || "";
    fake.dataset.name = d.name || d.symbol || "";
    fake.dataset.tf = d.tf || "1d";
    fake.dataset.kind = d.kind || "";
    openChart(fake);
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") {
      if (searchOverlay && !searchOverlay.hidden) {
        closeSymbolSearch();
        return;
      }
      if (modal.classList.contains("open")) closeModal();
    }
  });

  window.TWChartPack = {
    createPackChart,
    loadRemoteCharts,
    resolvePack,
    ardrSummary,
    packKey,
  };
})();
</script>
