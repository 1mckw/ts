<script>
(function () {
  const poolBar = document.getElementById("poolFilters");
  const tfBar = document.getElementById("tfFilters");
  const POOL_KEY = "tw_alerts_pool_filter";
  const TF_KEY = "tw_alerts_tf_filter";
  let pool = "all";
  let tf = "all";
  try {
    const savedPool = localStorage.getItem(POOL_KEY);
    if (savedPool) pool = savedPool;
    const savedTf = localStorage.getItem(TF_KEY);
    if (savedTf) tf = savedTf;
  } catch (_) {}

  function applyFilters() {
    if (poolBar) {
      poolBar.querySelectorAll("button[data-pool]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.pool === pool);
      });
    }
    if (tfBar) {
      tfBar.querySelectorAll("button[data-tf]").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.tf === tf);
      });
    }
    document.querySelectorAll("tbody[data-section] tr[data-group]").forEach((tr) => {
      const g = tr.dataset.group || "";
      const t = tr.dataset.timeframe || "";
      const poolOk = pool === "all" || g === pool;
      const tfOk = tf === "all" || t === tf;
      tr.hidden = !(poolOk && tfOk);
    });
  }

  if (poolBar) {
    poolBar.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-pool]");
      if (!btn) return;
      pool = btn.dataset.pool || "all";
      try { localStorage.setItem(POOL_KEY, pool); } catch (_) {}
      applyFilters();
    });
  }
  if (tfBar) {
    tfBar.addEventListener("click", (ev) => {
      const btn = ev.target.closest("button[data-tf]");
      if (!btn) return;
      tf = btn.dataset.tf || "all";
      try { localStorage.setItem(TF_KEY, tf); } catch (_) {}
      applyFilters();
    });
  }

  applyFilters();
})();
</script>
<script>
(function () {
  const catalog = window.SYMBOL_CATALOG || [];
  const fab = document.getElementById("searchFab");
  const overlay = document.getElementById("symbolOverlay");
  const input = document.getElementById("symbolSearch");
  const list = document.getElementById("symbolList");
  const closeBtn = document.getElementById("symbolSearchClose");
  if (!fab || !overlay || !input || !list) return;

  function openSearch() {
    overlay.hidden = false;
    input.value = "";
    render("");
    input.focus();
  }
  function closeSearch() {
    overlay.hidden = true;
  }
  function render(q) {
    const qq = q.trim().toLowerCase();
    const items = catalog.filter((x) => {
      if (!qq) return true;
      return (
        String(x.symbol).toLowerCase().includes(qq) ||
        String(x.name).toLowerCase().includes(qq) ||
        String(x.group).toLowerCase().includes(qq) ||
        String(x.timeframe).toLowerCase().includes(qq)
      );
    }).slice(0, 80);
    if (!items.length) {
      list.innerHTML = '<li class="empty">無符合商品</li>';
      return;
    }
    list.innerHTML = items
      .map((x) => {
        const pool = { index: "指數", twse: "上市", tpex: "上櫃" }[x.group] || x.group;
        const tf = String(x.timeframe || "1d").toUpperCase();
        const hit = x.hasHit ? " · 有信號" : "";
        return (
          `<li data-symbol="${x.symbol}" data-group="${x.group}" data-name="${x.name}" data-tf="${x.timeframe}">` +
          `<span class="sym">${x.symbol}</span> ${x.name} <small>(${pool} · ${tf}${hit})</small></li>`
        );
      })
      .join("");
  }

  fab.addEventListener("click", openSearch);
  closeBtn.addEventListener("click", closeSearch);
  overlay.addEventListener("click", (ev) => { if (ev.target === overlay) closeSearch(); });
  input.addEventListener("input", () => render(input.value));
  list.addEventListener("click", (ev) => {
    const li = ev.target.closest("li[data-symbol]");
    if (!li) return;
    closeSearch();
    document.dispatchEvent(
      new CustomEvent("open-symbol-chart", {
        detail: {
          symbol: li.dataset.symbol,
          group: li.dataset.group,
          name: li.dataset.name,
          tf: li.dataset.tf || "1d",
        },
      })
    );
  });
  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !overlay.hidden) closeSearch();
  });
})();
</script>
